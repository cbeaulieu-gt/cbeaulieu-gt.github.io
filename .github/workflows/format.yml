name: format

on:
  push:
    branches: [main]
  pull_request:

jobs:
  prettier:
    name: prettier --check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Run prettier --check
        run: npm run check

      - name: Run profile tests
        run: npm test
